<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Party! 🎤</title>
    <style>
        /* Sfondo scuro stile discoteca con font moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        /* Contenitore per i due bottoncioni */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 400px; /* Perfetto per gli smartphone */
        }

        /* Stile comune dei due bottoni giganti */
        .btn-gigante {
            display: block;
            padding: 30px 20px;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
        }

        /* Effetto quando si preme il bottone col dito o col mouse */
        .btn-gigante:active {
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Bottone Musica Italiana: Verde/Fuxia Neon */
        .btn-italiana {
            background: linear-gradient(45deg, #00ff87, #60efff);
            color: #111;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
            box-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
        }

        /* Bottone Musica Straniera: Viola/Rosa Neon */
        .btn-straniera {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .emoji {
            display: block;
            font-size: 3rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h1>🎤 KARAOKE PARTY 🎶</h1>
    <p>Scegli la tua prossima sfida musicale!</p>

    <div class="button-container">
        <!-- BOTTONE ITALIANA: inserisci il link alla lista italiana al posto del cancelletto # -->
        <a href="k-ita.html" class="btn-gigante btn-italiana">
            <span class="emoji">🇮🇹</span>
            Canzoni Italiane
        </a>

        <!-- BOTTONE STRANIERA: inserisci il link alla lista straniera al posto del cancelletto # -->
        <a href="k-int.html" class="btn-gigante btn-straniera">
            <span class="emoji">🌍</span>
            Canzoni Straniere
        </a>
    </div>

</body>
</html>
